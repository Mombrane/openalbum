# 新加坡 CVM 上的 Nginx 反向代理示例。
# 把 YOUR_DOMAIN_HERE 换成自己的域名；证书用 certbot 另行签发。

upstream photo_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    # return 301 https://$host$request_uri;
    # 证书尚未签发时，可以暂时用 HTTP 反代，签发后再改回跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    client_max_body_size 64m;

    # 网页静态文件（构建后再按实际目录调整 root）
    root /var/www/photo-album/web;
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://photo_api/;
    }

    location /health {
        proxy_pass http://photo_api/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
